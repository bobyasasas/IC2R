name: NeoForge migration

on:
  push:
    branches: ['neoforge26.1.2']
  pull_request:
    branches: ['neoforge26.1.2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate migration ledger
        run: python3 tools/migration/progress.py --check
      - name: Build and test migration modules
        run: bash gradlew clean build --console=plain
      - name: Run dedicated GameTest server (IC2)
        run: |
          bash gradlew :neoforge:runGameTestServer -PtestEnergyMode=IC2 --console=plain
          mkdir -p neoforge/build/reports/gametest/IC2
          cp neoforge/run/logs/latest.log neoforge/build/reports/gametest/IC2/
      - name: Run dedicated GameTest server (GT)
        run: |
          bash gradlew :neoforge:runGameTestServer -PtestEnergyMode=GT --console=plain
          mkdir -p neoforge/build/reports/gametest/GT
          cp neoforge/run/logs/latest.log neoforge/build/reports/gametest/GT/
      - name: Inspect packaged mod
        run: python3 tools/migration/verify_artifact.py
      - name: Show migration progress
        if: always()
        run: cat docs/migration/STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ic2r-neoforge-dev-${{ github.sha }}
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-reports-${{ github.sha }}
          path: |
            core/build/reports/tests/
            neoforge/run/logs/
            neoforge/build/reports/gametest/
            docs/migration/STATUS.md
          retention-days: 14
