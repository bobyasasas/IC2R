plugins { id 'net.neoforged.moddev' }

base { archivesName = 'ic2-neoforge' }

repositories {
    maven {
        name = 'blamejared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'cursemaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation project(':core')
    // JEI 29.37.0.98 is the 26.1.2 line (M14). Compile-only on purpose: the runtime
    // jar never ships with IC2 and the @JeiPlugin class stays unloaded without JEI.
    compileOnly 'mezz.jei:jei-26.1.2-common-api:29.37.0.98'
    compileOnly 'mezz.jei:jei-26.1.2-neoforge-api:29.37.0.98'
    // Jade 26.1.10+neoforge (M14-b), same compile-only interop policy as JEI.
    // Resolved through CurseMaven (project 324717, file 8651070).
    compileOnly 'curse.maven:jade-324717:8651070'
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom configurations.implementation

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ic2_tests'
            systemProperty 'ic2.tests.energyMode', providers.gradleProperty('testEnergyMode').getOrElse('IC2')
        }
    }
    mods {
        ic2 {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
        ic2_tests { sourceSet sourceSets.gameTest }
    }
    runs.configureEach {
        loadedMods = name == 'gameTestServer' ? [mods.ic2, mods.ic2_tests] : [mods.ic2]
    }
}

def metadata = [mod_version: project.version, neo_version: project.neo_version]
tasks.named('processResources') {
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

// Core is a plain Java library: embed its classes, not a second loader mod.
tasks.named('jar') { from project(':core').sourceSets.main.output }
tasks.named('sourcesJar') { from project(':core').sourceSets.main.allSource }
tasks.named('check') { dependsOn tasks.named('gameTestClasses') }
